<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Rift Runners: build progress</title>
  <style>
    @font-face { font-family: 'Lexend'; font-weight: 400; src: url('assets/fonts/lexend-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Lexend'; font-weight: 700; src: url('assets/fonts/lexend-latin-700-normal.woff2') format('woff2'); }
    body { margin: 0; background: #0b0e24; color: #fff; font-family: Lexend, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { color: #ffd76a; margin: 0 0 4px; font-size: 34px; }
    .sub { color: #aab6ff; margin: 0 0 28px; }
    .big { font-size: 56px; font-weight: 700; color: #ffd76a; }
    .bar { height: 30px; background: #141a33; border: 3px solid #6c7bd9; margin: 10px 0 8px; position: relative; }
    .fill { height: 100%; background: #5ee07a; }
    .demo { position: absolute; top: -6px; bottom: -6px; width: 4px; background: #ffc94a; }
    .note { color: #cfd6ff; margin: 6px 0; }
    ol { list-style: none; padding: 0; margin: 28px 0 0; }
    li { display: flex; gap: 14px; align-items: center; padding: 12px 14px; margin-bottom: 8px; background: #141a33; border-left: 6px solid #2a3470; }
    li.done { border-left-color: #5ee07a; }
    li.next { border-left-color: #ffc94a; background: #1d2550; }
    .id { font-weight: 700; width: 48px; color: #aab6ff; }
    .name { flex: 1; }
    .tag { font-size: 14px; padding: 3px 8px; background: #3a1d5c; color: #ffd76a; margin-left: 6px; }
    .est { color: #aab6ff; white-space: nowrap; }
    a { color: #ffd76a; }
  </style>
</head>
<body>
<main>
  <h1>Rift Runners: build progress</h1>
  <p class="sub" id="updated"></p>
  <div><span class="big" id="pct"></span> <span class="note">of the planned work is done</span></div>
  <div class="bar"><div class="fill" id="fill"></div><div class="demo" id="demoMark" title="December 2 demo"></div></div>
  <p class="note" id="left"></p>
  <p class="note" id="demo"></p>
  <ol id="list"></ol>
  <p class="note" style="margin-top:28px">Estimates are in work sessions (one small session with Claude). They get more accurate as the build goes on. <a href="game/">Play the game</a></p>
</main>
<script>
fetch('progress.json', { cache: 'no-cache' }).then(r => r.json()).then(p => {
  const mid = m => (m.sessions[0] + m.sessions[1]) / 2;
  const total = p.milestones.reduce((s, m) => s + mid(m), 0);
  const done = p.milestones.filter(m => m.done).reduce((s, m) => s + mid(m), 0);
  const left = p.milestones.filter(m => !m.done);
  const lo = left.reduce((s, m) => s + m.sessions[0], 0);
  const hi = left.reduce((s, m) => s + m.sessions[1], 0);
  const pct = Math.round(done / total * 100);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('updated').textContent = 'Updated ' + p.updated + ' after ' + p.sessionsSoFar + ' sessions';
  document.getElementById('left').textContent = 'About ' + lo + ' to ' + hi + ' sessions left for the whole game.';
  const demoLeft = left.filter(m => m.demo);
  const demoEnd = p.milestones.reduce((acc, m) => (m.demo ? acc.concat(m) : acc), []);
  if (demoLeft.length) {
    document.getElementById('demo').textContent = 'December 2 demo: about ' + demoLeft.reduce((s, m) => s + m.sessions[0], 0) + ' to ' +
      demoLeft.reduce((s, m) => s + m.sessions[1], 0) + ' sessions left (the gold mark on the bar).';
  } else {
    document.getElementById('demo').textContent = 'December 2 demo pieces are done.';
  }
  let upToDemo = 0;
  for (const m of p.milestones) { upToDemo += mid(m); if (m === demoEnd[demoEnd.length - 1]) break; }
  document.getElementById('demoMark').style.left = (upToDemo / total * 100) + '%';
  const firstOpen = left[0];
  document.getElementById('list').innerHTML = p.milestones.map(m => {
    const cls = m.done ? 'done' : (m === firstOpen ? 'next' : '');
    const est = m.done ? 'Done' : (m.sessions[0] === m.sessions[1] ? m.sessions[0] : m.sessions[0] + ' to ' + m.sessions[1]) + ' sessions';
    return '<li class="' + cls + '"><span class="id">' + m.id + '</span><span class="name">' + m.name +
      (m.demo ? '<span class="tag">Dec 2 demo</span>' : '') + (m === firstOpen ? '<span class="tag">Next</span>' : '') +
      '</span><span class="est">' + est + '</span></li>';
  }).join('');
});
</script>
</body>
</html>
