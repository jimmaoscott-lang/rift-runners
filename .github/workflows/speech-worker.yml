name: Speech checker

# Puts the speech checker (worker/) on Cloudflare whenever it changes. It copies the Azure key from
# this repo's GitHub Secrets into Cloudflare, so the key never appears in the public repo or the game.
# Needs one more GitHub Secret: CLOUDFLARE_API_TOKEN (see docs/SESSION-LOG.md, Session 11).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/speech-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Cloudflare token
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so the speech checker was not put online. The game keeps using Chrome's recognizer."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Put the speech checker on Cloudflare
        if: steps.check.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            AZURE_SPEECH_KEY
            AZURE_SPEECH_REGION
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
