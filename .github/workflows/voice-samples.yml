name: Voice samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/voice_samples.py"
      - "tools/voice-samples.trigger"
      - ".github/workflows/voice-samples.yml"

permissions:
  contents: write

jobs:
  make-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make voice samples with Azure
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/voice_samples.py
      - name: Save samples to the repo
        run: |
          git config user.name "voice-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/audio/samples || true
          if git diff --cached --quiet; then
            echo "No new audio."
          else
            git commit -m "Add voice samples"
            git push
          fi
