name: Build and deploy

# Runs on every push to main. Checks new words, voices any new game lines with Azure, builds the
# all-in-one offline / Apps Script file, and publishes the website on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that all words fit the skills taught so far
        run: python tools/check_decodable.py
      - name: Voice new game lines with Azure
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python tools/voice_lines.py
      - name: Save new voice files to the repo
        run: |
          git config user.name "voice-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/audio/ui assets/audio/words || true
          if git diff --cached --quiet; then
            echo "No new voice files."
          else
            git commit -m "Voice new game lines [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Build the all-in-one file
        run: python tools/build_single.py
      - name: Put the website together
        run: |
          mkdir -p _site
          cp index.html progress.html progress.json sound-check.html sound-samples.html _site/
          cp -r game _site/game
          mkdir -p _site/assets
          cp -r assets/fonts _site/assets/fonts
          mkdir -p _site/assets/audio
          if [ -d assets/audio/ui ]; then cp -r assets/audio/ui _site/assets/audio/ui; fi
          if [ -d assets/audio/words ]; then cp -r assets/audio/words _site/assets/audio/words; fi
          if [ -d assets/audio/samples ]; then cp -r assets/audio/samples _site/assets/audio/samples; fi
          cp -r dist _site/dist
          # Make browsers load fresh game code after every update.
          sed -i "s|\.js\"></script>|.js?v=${GITHUB_SHA::8}\"></script>|g" _site/game/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
